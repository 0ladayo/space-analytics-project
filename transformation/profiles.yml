space_analytics:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'data-and-analytics-engineering') }}"
      dataset: "{{ env_var('DBT_DATASET_ID', 'space_analytics') }}"
      location: "{{ env_var('GCP_REGION', 'europe-west1') }}"
      threads: 4
