unit_tests:
  - name: test_int_launches_computes_turnaround_and_window_precision
    description: >
      Verify consecutive pad and vehicle fleet turnaround hours/days, instantaneous window flagging,
      in-window liftoff slip, and anomaly flags in int_launches__enriched.
    model: int_launches__enriched
    given:
      - input: ref('stg_space_analytics_raw__launches')
        rows:
          - launch_id: 'l-1'
            net: '2026-01-10 00:00:00 UTC'
            window_start: '2026-01-10 00:00:00 UTC'
            window_end: '2026-01-10 00:00:00 UTC'
            pad_id: 80
            rocket_id: 1
            rocket_name: 'Falcon 9 Block 5'
            status_abbrev: 'Success'
          - launch_id: 'l-2'
            net: '2026-01-13 12:15:00 UTC'
            window_start: '2026-01-13 12:00:00 UTC'
            window_end: '2026-01-13 13:00:00 UTC'
            pad_id: 80
            rocket_id: 2
            rocket_name: 'Falcon 9 Block 5'
            status_abbrev: 'Partial Failure'
    expect:
      rows:
        - launch_id: 'l-1'
          pad_turnaround_hours: null
          pad_turnaround_days: null
          vehicle_turnaround_hours: null
          is_instantaneous_window: true
          window_duration_bucket: 'Instantaneous (0m)'
          liftoff_slip_mins: 0.0
          window_consumed_pct: 0.0
          is_t0_on_time: true
          is_anomaly: false
          is_launch_failure: false
        - launch_id: 'l-2'
          pad_turnaround_hours: 84.25
          pad_turnaround_days: 3.51
          vehicle_turnaround_hours: 84.25
          is_instantaneous_window: false
          window_duration_bucket: 'Medium (31-120m)'
          liftoff_slip_mins: 15.0
          window_consumed_pct: 25.0
          is_t0_on_time: false
          is_anomaly: true
          is_launch_failure: true
