unit_tests:
  - name: test_stg_launches_standardizes_orbits_and_sectors
    description: >
      Verify whitespace trimming (case-preserving), deduplication, agency_sector mapping,
      and orbit_regime bucketing in stg_space_analytics_raw__launches.
    model: stg_space_analytics_raw__launches
    given:
      - input: source('space_analytics_raw', 'launches')
        rows:
          - launch_id: 'l-1'
            launch_name: '  Falcon 9 Block 5 | Starlink  '
            last_updated: '2026-02-01 12:00:00 UTC'
            net: '2026-02-01 10:00:00 UTC'
            window_start: '2026-02-01 10:00:00 UTC'
            window_end: '2026-02-01 10:00:00 UTC'
            status_name: 'Launch Successful'
            status_abbrev: 'Success'
            fail_reason: ''
            agency_id: 121
            agency_name: ' SpaceX '
            agency_type: ' Commercial '
            agency_country: 'USA'
            rocket_id: 1
            rocket_name: 'Falcon 9 Block 5'
            mission_name: 'Starlink'
            mission_type: 'Communications'
            orbit_name: 'Low Earth Orbit'
            orbit_abbrev: ' VLEO '
            pad_id: 80
            pad_name: 'SLC-40'
            location_name: 'Cape Canaveral SFS, FL, USA'
            latitude: 28.5619
            longitude: -80.5774
