steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - run
      - jobs
      - deploy
      - ingestion-job
      - --region=${_LOCATION}
      - --source=.
      - --set-build-env-vars=GOOGLE_ENTRYPOINT=python ingestion/ingestion.py
      - --build-service-account=projects/${_PROJECT_ID}/serviceAccounts/${_SERVICE_ACCOUNT_EMAIL}
      - --service-account=${_SERVICE_ACCOUNT_EMAIL}
      - --memory=2Gi
      - --task-timeout=540s
      - --max-retries=1
      - --set-env-vars=PYTHONUNBUFFERED=True,RAW_BUCKET_NAME=${_RAW_BUCKET_NAME}
options:
  logging: CLOUD_LOGGING_ONLY
