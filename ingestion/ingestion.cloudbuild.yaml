steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - run
      - jobs
      - deploy
      - ingestion-job
      - --region=${_LOCATION}
      - --source=./ingestion
      - --service-account=${_SERVICE_ACCOUNT_EMAIL}
      - --memory=2Gi
      - --task-timeout=540s
      - --max-retries=1
      - --set-env-vars=PYTHONUNBUFFERED=True,RAW_BUCKET_NAME=${_RAW_BUCKET_NAME}
options:
  logging: CLOUD_LOGGING_ONLY
