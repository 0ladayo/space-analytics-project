steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - run
      - deploy
      - loading-service
      - --region=${_LOCATION}
      - --source=./loading
      - --service-account=${_SERVICE_ACCOUNT_EMAIL}
      - --no-allow-unauthenticated
      - --max-instances=1
      - --memory=1Gi
      - --timeout=540s
      - --set-env-vars=PYTHONUNBUFFERED=True,BIGQUERY_TABLE_ID=${_BIGQUERY_TABLE_ID}
options:
  logging: CLOUD_LOGGING_ONLY
